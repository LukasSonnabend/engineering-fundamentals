name: Dependabot Auto-Merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Restrict default token permissions at workflow level
permissions: {}

jobs:
  auto-merge:
    name: Auto-merge safe Dependabot updates
    runs-on: ubuntu-latest
    # Only run when CI succeeded on a Dependabot pull request
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    # Grant write permissions only to this job
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Verify and auto-merge minor/patch Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No associated pull request found."
            exit 0
          fi

          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json author,title,state)
          echo "$PR_JSON"

          SHOULD_MERGE=$(node -e '
            const pr = JSON.parse(process.argv[1]);
            if (pr.state !== "OPEN" || pr.author?.login !== "dependabot[bot]") {
              process.exit(0);
            }
            const title = pr.title || "";
            // Allow grouped minor/patch updates configured in dependabot.yml
            if (title.includes("minor-patch")) {
              console.log("true");
              process.exit(0);
            }
            // Allow single-package minor/patch semver bumps (major version unchanged)
            const match = title.match(/from\s+v?(\d+)\.\d+\.\d+\s+to\s+v?(\d+)\.\d+\.\d+/i);
            if (match && match[1] === match[2]) {
              console.log("true");
            }
          ' "$PR_JSON")

          if [ "$SHOULD_MERGE" = "true" ]; then
            gh pr merge --auto --squash "$PR_NUMBER" --repo "$REPO"
          else
            echo "Skipping auto-merge (major update or requires manual review)."
          fi
